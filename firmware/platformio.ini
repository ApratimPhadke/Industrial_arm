; Vector Robotics arm - ESP32 firmware (PlatformIO)
;
;   pio run -e set_id -t upload       -> CAN-ID setup tool (use once per motor)
;   pio run -e arm_bridge -t upload   -> normal arm firmware
;   pio device monitor                -> serial console (type a command, press Enter)
;
; In VS Code: PlatformIO sidebar -> pick the environment -> Upload, then Monitor.

[platformio]
default_envs = arm_bridge

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; Send a whole line when you press Enter (the firmware treats a pause as end-of-command).
monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes
build_flags = -Wall

[env:arm_bridge]
build_src_filter = +<arm_bridge/>

[env:set_id]
build_src_filter = +<set_id/>
